name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Type-check for macOS 11
        run: |
          swiftc \
            -typecheck \
            -warnings-as-errors \
            -swift-version 5 \
            -target "$(uname -m)-apple-macosx11.0" \
            -framework Cocoa \
            -framework Foundation \
            Sources/CryptoFloatCore/*.swift \
            Sources/CryptoFloatApp/*.swift

      - name: Run unit tests
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build and validate app
        run: |
          ./build.sh
          plutil -lint CryptoFloat.app/Contents/Info.plist
          codesign --verify --deep --strict CryptoFloat.app

      - name: Package build artifact
        run: ditto -c -k --keepParent CryptoFloat.app CryptoFloat.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CryptoFloat-macos
          path: CryptoFloat.zip
